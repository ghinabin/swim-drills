<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04202A" />
    <title>50 free — NSA Cup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --deep: #04202a;
        --card: #0b3a48;
        --card-2: #0f4658;
        --line: #17586c;
        --foam: #e9f5f7;
        --mute: #8fb4bf;
        --amber: #ffb224;
        --signal: #ff6a45;
        --cyan: #6fd0e0;
        --ok: #49d6a6;
        --pad: 16px;
        --r: 14px;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --ui:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        --disp: "Barlow Condensed", "Oswald", Impact, sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      body {
        background: var(--deep);
        color: var(--foam);
        font-family: var(--ui);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: contain;
      }
      ~ button {
        font-family: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
        text-align: left;
      }
      :focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
        border-radius: 8px;
      }

      #home {
        min-height: 100vh;
      }
      body.locked {
        overflow: hidden;
        position: fixed;
        width: 100%;
      }
      #detail {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--deep);
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        transform: translateX(100%);
        transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
        box-shadow: -18px 0 40px rgba(0, 0, 0, 0.45);
      }
      #detail.open {
        transform: translateX(0);
      }
      @media (prefers-reduced-motion: reduce) {
        #detail {
          transition: none;
        }
      }

      /* ---------- hero ---------- */
      .hero {
        padding: calc(var(--sat) + 22px) var(--pad) 20px;
        background:
          radial-gradient(
            120% 90% at 82% -12%,
            rgba(255, 178, 36, 0.13),
            transparent 62%
          ),
          linear-gradient(180deg, #083544 0%, var(--deep) 100%);
        border-bottom: 1px solid var(--line);
      }
      .kicker {
        font-size: 12.5px;
        color: var(--mute);
        margin: 0 0 3px;
      }
      .hero h1 {
        font-family: var(--disp);
        font-weight: 700;
        font-size: 34px;
        line-height: 0.98;
        margin: 0 0 14px;
      }
      .countdown {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px;
      }
      .countdown b {
        font-family: var(--disp);
        font-weight: 700;
        font-size: 44px;
        line-height: 0.85;
        color: var(--amber);
        font-variant-numeric: tabular-nums;
      }
      .countdown span {
        font-size: 13.5px;
        color: var(--mute);
        max-width: 190px;
        line-height: 1.3;
      }

      .grid-wrap {
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .dowrow,
      .wkrow {
        display: flex;
        gap: 5px;
        margin-bottom: 5px;
        align-items: stretch;
      }
      .dowrow i {
        font-style: normal;
        font-size: 10.5px;
        color: var(--mute);
        text-align: center;
        font-weight: 600;
        flex: 1 1 0;
        min-width: 0;
      }
      .dowrow i:first-child,
      .wklab {
        flex: 0 0 34px;
        width: 34px;
      }
      .wklab {
        font-size: 10.5px;
        color: var(--mute);
        display: flex;
        align-items: center;
        font-weight: 600;
      }
      .dot {
        flex: 1 1 0;
        min-width: 0;
        aspect-ratio: 1/1;
        min-height: 34px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        font-family: var(--disp);
        font-size: 14px;
        font-weight: 600;
        color: var(--mute);
      }
      .dot.rest {
        background: transparent;
        border: 1px dashed rgba(143, 180, 191, 0.35);
        color: rgba(143, 180, 191, 0.5);
      }
      .dot.part {
        background: rgba(73, 214, 166, 0.22);
        color: var(--ok);
      }
      .dot.done {
        background: var(--ok);
        color: #04202a;
        border-color: var(--ok);
      }
      .dot.today {
        border-color: var(--amber);
        color: var(--amber);
        box-shadow: inset 0 0 0 1px var(--amber);
      }
      .dot.today.done {
        color: #04202a;
      }
      .dot.race {
        background: var(--amber);
        color: #04202a;
        border-color: var(--amber);
        flex: 0 0 auto;
        width: calc((100% - 69px) / 7);
      }
      .racecap {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        font-size: 11.5px;
        color: var(--mute);
        padding-left: 9px;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 12px;
        font-size: 11.5px;
        color: var(--mute);
      }
      .legend i {
        font-style: normal;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sw {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }

      /* ---------- weeks ---------- */
      main {
        padding: 0 var(--pad) calc(var(--sab) + 44px);
      }
      .week {
        border-bottom: 1px solid var(--line);
      }
      .wkhead {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 17px 2px;
        min-height: 62px;
      }
      .wkhead .idx {
        font-family: var(--disp);
        font-weight: 700;
        font-size: 26px;
        line-height: 1;
        width: 24px;
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .wkhead .meta {
        flex: 1;
        min-width: 0;
      }
      .wkhead .meta b {
        display: block;
        font-size: 15.5px;
        font-weight: 600;
      }
      .wkhead .meta em {
        display: block;
        font-style: normal;
        font-size: 12.5px;
        color: var(--mute);
        margin-top: 2px;
      }
      .ring {
        width: 38px;
        height: 38px;
        flex: none;
        position: relative;
      }
      .ring svg {
        transform: rotate(-90deg);
        display: block;
      }
      .ring span {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10.5px;
        font-weight: 600;
        color: var(--mute);
        font-variant-numeric: tabular-nums;
      }
      .chev {
        width: 20px;
        flex: none;
        color: var(--mute);
        transition: transform 0.25s;
      }
      .week.open .chev {
        transform: rotate(180deg);
      }
      .wkbody {
        display: none;
        padding: 0 0 12px;
      }
      .week.open .wkbody {
        display: block;
      }
      .wkcap {
        margin: 0 2px 12px;
        font-size: 12.5px;
        color: var(--mute);
      }

      .daycard {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 13px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 13px;
        margin-bottom: 8px;
        min-height: 68px;
      }
      .daycard:active {
        background: var(--card-2);
      }
      .daycard.restday {
        background: transparent;
        border-style: dashed;
        opacity: 0.72;
      }
      .daycard.raceday {
        background: linear-gradient(135deg, #ffb224, #ff8a3c);
        border-color: var(--amber);
        color: #04202a;
      }
      .daycard.istoday {
        border-color: var(--amber);
      }
      .dstamp {
        width: 44px;
        flex: none;
        text-align: center;
      }
      .dstamp b {
        display: block;
        font-family: var(--disp);
        font-weight: 700;
        font-size: 22px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .dstamp em {
        display: block;
        font-style: normal;
        font-size: 10.5px;
        color: var(--mute);
        margin-top: 2px;
      }
      .raceday .dstamp em,
      .raceday .dinfo em {
        color: rgba(4, 32, 42, 0.75);
      }
      .dinfo {
        flex: 1;
        min-width: 0;
      }
      .dinfo b {
        display: block;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.25;
      }
      .dinfo em {
        display: block;
        font-style: normal;
        font-size: 12.5px;
        color: var(--mute);
        margin-top: 3px;
      }
      .dtick {
        width: 26px;
        height: 26px;
        flex: none;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dtick.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #04202a;
      }
      .dtick svg {
        width: 14px;
        height: 14px;
      }
      .dtick:not(.on) svg {
        display: none;
      }
      .reset {
        display: block;
        margin: 26px auto 0;
        font-size: 13px;
        color: var(--mute);
        padding: 13px 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        text-align: center;
      }

      /* ---------- detail ---------- */
      .dhead {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: calc(var(--sat) + 8px) var(--pad) 12px;
        background: rgba(6, 40, 50, 0.94);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .backbtn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 14.5px;
        color: var(--mute);
        padding: 10px 12px 10px 0;
        margin-left: -2px;
        min-height: 44px;
      }
      .dhead h2 {
        font-family: var(--disp);
        font-weight: 700;
        font-size: 27px;
        line-height: 1.02;
        margin: 0 0 9px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 11.5px;
        color: var(--mute);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 3px 8px;
        font-variant-numeric: tabular-nums;
      }
      .chip.hot {
        color: var(--amber);
        border-color: rgba(255, 178, 36, 0.45);
      }
      .bar {
        height: 3px;
        background: var(--line);
        border-radius: 2px;
        margin-top: 13px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ok);
        transition: width 0.3s;
      }
      .barlab {
        font-size: 11.5px;
        color: var(--mute);
        margin-top: 6px;
      }

      .dbody {
        padding: 18px var(--pad) calc(var(--sab) + 48px);
      }
      .note {
        border-left: 3px solid var(--amber);
        background: rgba(255, 178, 36, 0.08);
        padding: 12px 14px;
        border-radius: 0 var(--r) var(--r) 0;
        font-size: 13.5px;
        color: #f2e5cb;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .hint {
        font-size: 12.5px;
        color: var(--mute);
        margin: 0 2px 10px;
      }

      /* the whole card is the tap target */
      .block {
        display: flex;
        width: 100%;
        gap: 12px;
        align-items: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 4px solid var(--mute);
        border-radius: var(--r);
        padding: 14px 13px;
        margin-bottom: 9px;
        transition:
          background 0.12s,
          opacity 0.15s;
      }
      .block:active {
        background: var(--card-2);
      }
      .block[data-k="tech"] {
        border-left-color: var(--cyan);
      }
      .block[data-k="skill"] {
        border-left-color: var(--amber);
      }
      .block[data-k="pace"] {
        border-left-color: var(--foam);
      }
      .block[data-k="max"] {
        border-left-color: var(--signal);
      }
      .block.done {
        opacity: 0.5;
      }
      .block.done .btitle {
        text-decoration: line-through;
      }

      .bnum {
        flex: 0 0 42px;
        text-align: center;
        font-family: var(--disp);
        font-weight: 700;
        line-height: 1;
        color: var(--mute);
        font-variant-numeric: tabular-nums;
        padding-top: 1px;
      }
      .bnum b {
        display: block;
        font-size: 26px;
      }
      .bnum em {
        display: block;
        font-style: normal;
        font-size: 9.5px;
        color: var(--mute);
        margin-top: 3px;
      }
      .block[data-k="tech"] .bnum {
        color: var(--cyan);
      }
      .block[data-k="skill"] .bnum {
        color: var(--amber);
      }
      .block[data-k="pace"] .bnum {
        color: var(--foam);
      }
      .block[data-k="max"] .bnum {
        color: var(--signal);
      }

      .bmain {
        flex: 1;
        min-width: 0;
      }
      .btitle {
        display: inline;
        font-size: 15.5px;
        font-weight: 600;
      }
      .tag {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 6px;
        margin-left: 7px;
        vertical-align: 2px;
        font-style: normal;
        border: 1px solid currentColor;
        white-space: nowrap;
      }
      .tag.easy {
        color: var(--mute);
      }
      .tag.tech {
        color: var(--cyan);
      }
      .tag.skill {
        color: var(--amber);
      }
      .tag.pace {
        color: var(--foam);
      }
      .tag.max {
        color: var(--signal);
      }
      .bdesc {
        display: block;
        margin-top: 6px;
        font-size: 13.5px;
        color: #c7dfe4;
        line-height: 1.45;
      }
      .btarget {
        display: block;
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--mute);
      }

      .bcheck {
        flex: 0 0 30px;
        height: 30px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 2px;
      }
      .bcheck svg {
        width: 16px;
        height: 16px;
        display: none;
        color: #04202a;
      }
      .block.done .bcheck {
        background: var(--ok);
        border-color: var(--ok);
      }
      .block.done .bcheck svg {
        display: block;
      }

      .allbtn {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        font-size: 14px;
        color: var(--mute);
        text-align: center;
        min-height: 52px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--sab) + 26px);
        transform: translateX(-50%) translateY(14px);
        background: var(--foam);
        color: #04202a;
        font-size: 13.5px;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 999px;
        z-index: 60;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (min-width: 620px) {
        body {
          max-width: 560px;
          margin: 0 auto;
          box-shadow: 0 0 0 1px var(--line);
        }
        #detail {
          left: 50%;
          width: 100%;
          max-width: 560px;
          transform: translateX(-50%) translateX(100%);
        }
        #detail.open {
          transform: translateX(-50%);
        }
      }
    </style>
  </head>
  <body>
    <div id="home">
      <header class="hero">
        <p class="kicker">14th NSA Cup, Satdobato</p>
        <h1>50 free<br />Chasing 29.9</h1>
        <div class="countdown">
          <b id="cd">28</b
          ><span id="cdlab">days of training left before race day</span>
        </div>
        <div class="grid-wrap">
          <div class="dowrow">
            <i></i><i>M</i><i>T</i><i>W</i><i>T</i><i>F</i><i>S</i><i>S</i>
          </div>
          <div id="cal"></div>
          <div class="legend">
            <i
              ><span class="sw" style="background: var(--ok)"></span>Finished</i
            >
            <i
              ><span
                class="sw"
                style="box-shadow: inset 0 0 0 1.5px var(--amber)"
              ></span
              >Today</i
            >
            <i
              ><span
                class="sw"
                style="border: 1px dashed rgba(143, 180, 191, 0.5)"
              ></span
              >Rest</i
            >
            <i><span class="sw" style="background: var(--amber)"></span>Race</i>
          </div>
        </div>
      </header>
      <main id="weeks"></main>
      <button class="reset" id="resetBtn">Clear all progress</button>
    </div>

    <div id="detail" aria-hidden="true">
      <div class="dhead">
        <button class="backbtn" id="back">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
          All weeks
        </button>
        <h2 id="dTitle"></h2>
        <div class="chips" id="dChips"></div>
        <div class="bar"><i id="dBar"></i></div>
        <div class="barlab" id="dBarLab"></div>
      </div>
      <div class="dbody" id="dBody"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      /* ============================ DATA ============================ */
      function b(n, t, d, r, k) {
        return { n: n, t: t, d: d, r: r || "", k: k || "easy" };
      }
      function assign(a, b2) {
        var o = {},
          k;
        for (k in a) {
          if (a.hasOwnProperty(k)) o[k] = a[k];
        }
        for (k in b2) {
          if (b2.hasOwnProperty(k)) o[k] = b2[k];
        }
        return o;
      }
      function findBy(arr, fn) {
        for (var i = 0; i < arr.length; i++) {
          if (fn(arr[i])) return arr[i];
        }
        return null;
      }

      var BASE = [
        {
          dow: "Mon",
          title: "Maximum speed and turns",
          pool: "25 m",
          laps: 40,
          dist: "1,000 m",
          blocks: [
            b(
              10,
              "Warm-up",
              "4 easy free, 2 free with 5 dolphin kicks off each wall, 2 board kick easy, 2 build to 80%",
              "Continuous",
              "easy",
            ),
            b(
              6,
              "Kick on board",
              "6 × 25 flutter kick, fast",
              "30 s rest. Hold 22–25 s",
              "tech",
            ),
            b(
              4,
              "Fist swimming",
              "4 × 25, feel the pressure on your forearm",
              "20 s rest",
              "tech",
            ),
            b(
              "8 min",
              "Turn block",
              "8 to 10 reps. Swim in from 10 m, flip, 5 dolphin kicks, breakout, 5 strokes.",
              "Full rest. Quality only",
              "skill",
            ),
            b(
              14,
              "Main set",
              "7 × (25 maximum from push + 25 easy back)",
              "2:00 cycle. Target 14.5",
              "max",
            ),
            b(6, "Cool-down", "6 easy, long relaxed strokes", "", "easy"),
          ],
        },

        {
          dow: "Tue",
          title: "Race pace and dolphin kick",
          pool: "25 m",
          laps: 40,
          dist: "1,000 m",
          blocks: [
            b(10, "Warm-up", "4 easy, 4 build, 2 kick", "Continuous", "easy"),
            b(
              6,
              "Pull buoy",
              "6 × 25 with buoy, high arm tempo",
              "30 s rest",
              "tech",
            ),
            b(
              4,
              "Fist swimming",
              "2 fist, 2 open hand. Feel the difference in grip",
              "20 s rest",
              "tech",
            ),
            b(
              "8 min",
              "Vertical dolphin kick",
              "Deep corner. 10 s hard, 20 s easy. Week 1: 8 reps. Week 2: 10 reps.",
              "Hands on chest or above head",
              "skill",
            ),
            b(
              14,
              "Main set",
              "10 × 25 at race pace on 1:00, then 4 easy",
              "Hold 14.5–15.0 every rep",
              "pace",
            ),
            b(6, "Cool-down", "6 easy", "", "easy"),
          ],
        },

        {
          dow: "Wed",
          title: "Recovery and breakouts",
          pool: "25 m",
          laps: 40,

          '<span class="dinfo"><b>' +
          d.title +
          "</b><em>" +
          sub +
          "</em></span>" +
          '<span class="dtick' +
          (complete(d) ? " on" : "") +
          '">' +
          TICK +
          "</span>";
        c.onclick = function () {
          openDay(d.id);
        };
        return c;
      }

      /* ============================ DETAIL ============================ */
      var cur = null,
        pushed = false,
        homeY = 0;

      function openDay(id) {
        cur = findBy(DAYS, function (x) {
          return x.id === id;
        });
        draw();
        homeY = window.scrollY || 0;
        document.body.style.top = -homeY + "px";
        document.body.classList.add("locked");
        var v = document.getElementById("detail");
        v.classList.add("open");
        v.setAttribute("aria-hidden", "false");
        v.scrollTop = 0;
        try {
          history.pushState({ d: id }, "");
          pushed = true;
        } catch (e) {
          pushed = false;
        }
      }
      function closeDay() {
        pushed = false;
        var v = document.getElementById("detail");
        v.classList.remove("open");
        v.setAttribute("aria-hidden", "true");
        document.body.classList.remove("locked");
        document.body.style.top = "";
        window.scrollTo(0, homeY);
        renderCal();
        renderWeeks();
      }
      function bar() {
        var t = total(cur),
          n = count(cur.id);
        document.getElementById("dBar").style.width =
          (t ? (n / t) * 100 : 0) + "%";
        document.getElementById("dBarLab").textContent = t
          ? n + " of " + t + " done"
          : "";
      }

      function draw() {
        var d = cur;
        document.getElementById("dTitle").textContent = d.title;
        var parts = [
          '<span class="chip">' + d.dow + " " + fmt(d.date) + "</span>",
          '<span class="chip">' + d.weekName + "</span>",
        ];
        if (!d.rest && !d.race) {
          parts.push('<span class="chip">' + d.pool + " pool</span>");
          parts.push(
            '<span class="chip hot">' + d.laps + " laps, " + d.dist + "</span>",
          );
        }
        if (d.race) parts.push('<span class="chip hot">50 m freestyle</span>');
        document.getElementById("dChips").innerHTML = parts.join("");

        var body = document.getElementById("dBody");
        body.innerHTML = "";
        if (d.note) {
          var n = document.createElement("div");
          n.className = "note";
          n.textContent = d.note;
          body.appendChild(n);
        }

        if (d.race) {
          var h = document.createElement("p");
          h.className = "hint";
          h.textContent = "Work through these in order.";
          body.appendChild(h);
        }

        d.blocks.forEach(function (bl, i) {
          var card = document.createElement("button");
          card.className = "block" + (isDone(d.id, i) ? " done" : "");
          card.setAttribute("data-k", bl.k);
          card.setAttribute("aria-pressed", isDone(d.id, i) ? "true" : "false");

          var num = d.race
            ? "<b>" + bl.n + "</b><em>step</em>"
            : bl.n === 0
              ? "<b>·</b><em></em>"
              : typeof bl.n === "number"
                ? "<b>" + bl.n + "</b><em>laps</em>"
                : "<b>" + String(bl.n).replace(" min", "") + "</b><em>min</em>";

          card.innerHTML =
            '<span class="bnum">' +
            num +
            "</span>" +
            '<span class="bmain"><span class="btitle">' +
            bl.t +
            (d.race
              ? ""
              : '<i class="tag ' + bl.k + '">' + LAB[bl.k] + "</i>") +
            "</span>" +
            '<span class="bdesc">' +
            bl.d +
            "</span>" +
            (bl.r ? '<span class="btarget">' + bl.r + "</span>" : "") +
            "</span>" +
            '<span class="bcheck">' +
            TICK +
            "</span>";

          card.onclick = function () {
            if (!S.done[d.id]) S.done[d.id] = {};
            if (S.done[d.id]["b" + i]) delete S.done[d.id]["b" + i];
            else S.done[d.id]["b" + i] = 1;
            save();
            var on = isDone(d.id, i);
            card.classList.toggle("done", on);
            card.setAttribute("aria-pressed", on ? "true" : "false");
            buzz(10);
            bar();
            syncAll();
            if (complete(d)) {
              buzz([14, 60, 14]);
              toast("Session done.");
            }
          };
          body.appendChild(card);
        });

        var all = document.createElement("button");
        all.className = "allbtn";
        all.id = "allBtn";
        all.onclick = function () {
          var finish = !complete(d);
          S.done[d.id] = {};
          if (finish) {
            for (var i = 0; i < d.blocks.length; i++) S.done[d.id]["b" + i] = 1;
          }
          save();
          buzz(finish ? [14, 60, 14] : 10);
          draw();
          document.getElementById("detail").scrollTop = 0;
        };
        body.appendChild(all);
        syncAll();
        bar();
      }
      function syncAll() {
        var el = document.getElementById("allBtn");
        if (el)
          el.textContent = complete(cur)
            ? "Untick this session"
            : "Tick everything off";
      }

      /* ============================ WIRING ============================ */
      document.getElementById("back").onclick = function () {
        if (pushed) history.back();
        else closeDay();
      };
      window.addEventListener("popstate", function () {
        closeDay();
      });

      var armed = false,
        armT = null;
      document.getElementById("resetBtn").onclick = function () {
        var btn = this;
        if (!armed) {
          armed = true;
          btn.textContent = "Tap again to clear everything";
          btn.style.color = "var(--signal)";
          btn.style.borderColor = "var(--signal)";
          clearTimeout(armT);
          armT = setTimeout(function () {
            armed = false;
            btn.textContent = "Clear all progress";
            btn.style.color = "";
            btn.style.borderColor = "";
          }, 4000);
          return;
        }
        clearTimeout(armT);
        armed = false;
        btn.textContent = "Clear all progress";
        btn.style.color = "";
        btn.style.borderColor = "";
        S = { done: {} };
        save();
        renderCal();
        renderWeeks();
        toast("Progress cleared.");
      };

      (function () {
        var sx = 0,
          sy = 0,
          track = false,
          v = document.getElementById("detail");
        v.addEventListener(
          "touchstart",
          function (e) {
            if (!v.classList.contains("open")) return;
            sx = e.touches[0].clientX;
            sy = e.touches[0].clientY;
            track = sx < 42;
          },
          { passive: true },
        );
        v.addEventListener(
          "touchmove",
          function (e) {
            if (!track) return;
            var dx = e.touches[0].clientX - sx,
              dy = Math.abs(e.touches[0].clientY - sy);
            if (dx > 70 && dy < 50) {
              track = false;
              if (pushed) history.back();
              else closeDay();
            }
          },
          { passive: true },
        );
      })();

      renderCountdown();
      renderCal();
      renderWeeks();
      load(function () {
        renderCal();
        renderWeeks();
        if (memOnly)
          setTimeout(function () {
            toast("Ticks are kept for this session only.");
          }, 1200);
      });
    </script>
  </body>
</html>
